# W9b — Heads Up tone eval set fixtures.
# Historical note: source plan lived under docs/superpowers (removed 2026-09-23).
# This fixture remains for meeting-heads-up tests until that surface is retired.
# Any change here MUST be mirrored in the spec doc — that doc is the locked contract.
#
# Tests: backend/tests/test_heads_up_eval.py
# Threshold: >= 18 of 20 items must pass deterministic checks for CI green.

threshold_pass_count: 18
total_items: 20

anti_pattern_blocklist:
  # Imperative verbs about user behavior
  - "you should"
  - "don't forget to"
  - "make sure to"
  - "be sure to"
  # Failure verbs
  - "you forgot"
  - "you missed"
  - "you skipped"
  - "you owe"
  - "you failed"
  - "you neglected"
  - "you committed to"
  # Mind-reading the other party
  - "they may be frustrated"
  - "he might be annoyed"
  - "she's likely upset"
  - "their morale may be"
  - "they probably feel"
  # Loaded judgment
  - "overdue"
  - "deadline missed"
  - "stalemate"
  - "dropped the ball"
  - "behind on"

items:
  - id: heads_up_eval_01
    category: open_commitment
    target: PASS_NON_EMPTY
    candidate_input:
      - kind: open_commitment
        attendee: Sarah Chen
        description: send Q2 strategy doc
        days_open: 13
        source_meeting_id: meet_abc123
        source_quote: "I'll send the Q2 strategy doc by Friday"
        source_meeting_date: 2026-05-08
    must_contain: ["Q2 strategy doc"]
    expected_note_count: 1
    notes_max: 2
    citation_required: true

