<!--
  PersonaOn — Magic Link / Sign-in Code email template.
  Canonical source. Paste this body into:
    Supabase Dashboard → Auth → Email Templates → Magic Link

  Suggested subject:
    Your PersonaOn sign-in code: {{ .Token }}

  Supabase template variables used:
    {{ .Token }}            8-digit one-time code
    {{ .ConfirmationURL }}  one-click sign-in link
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your PersonaOn sign-in code</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg    { background:#0A0A0A !important; }
        .card  { background:#161618 !important; border-color:#2A2A2C !important; }
        .ink   { color:#F5F5F7 !important; }
        .sub   { color:#A1A1A6 !important; }
        .code  { background:#1D1D1F !important; border-color:#2A2A2C !important; }
        .codetxt { color:#F5F5F7 !important; }
        .footer  { color:#6E6E73 !important; }
        .button  { background:#0A84FF !important; }
      }
      @media (max-width: 480px) {
        .card     { padding: 32px 24px !important; }
        .codetxt  { font-size: 28px !important; letter-spacing: 8px !important; }
      }
    </style>
  </head>
  <body class="bg" style="margin:0; padding:0; background:#F5F5F7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg" style="background:#F5F5F7;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">

            <!-- Wordmark -->
            <tr>
              <td align="center" style="padding-bottom:32px;">
                <span class="ink" style="font-family:Georgia,'Times New Roman',serif; font-size:24px; color:#1D1D1F; letter-spacing:-0.005em;">
                  PersonaOn<span style="display:inline-block; width:5px; height:5px; border-radius:50%; background:#0066CC; margin-left:6px; vertical-align:middle;"></span>
                </span>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td class="card" style="background:#FFFFFF; border-radius:16px; border:1px solid rgba(29,29,31,0.06); padding:48px 40px;">

                <h1 class="ink" style="margin:0 0 12px; font-size:22px; font-weight:600; color:#1D1D1F; letter-spacing:-0.02em; line-height:1.3;">
                  Your sign-in code
                </h1>
                <p class="sub" style="margin:0 0 28px; font-size:15px; color:rgba(29,29,31,0.62); line-height:1.5;">
                  Enter this code in PersonaOn to continue. It expires in 60 minutes.
                </p>

                <!-- Code -->
                <div class="code" style="background:#F5F5F7; border:1px solid rgba(29,29,31,0.06); border-radius:12px; padding:24px; text-align:center; margin-bottom:28px;">
                  <span class="codetxt ink" style="font-family:'SF Mono',Menlo,Monaco,Consolas,monospace; font-size:32px; font-weight:500; color:#1D1D1F; letter-spacing:12px; line-height:1;">{{ .Token }}</span>
                </div>

                <!-- Or click link -->
                <p class="sub" style="margin:0 0 12px; font-size:14px; color:rgba(29,29,31,0.62); line-height:1.5;">
                  Or tap the button to sign in instantly:
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td class="button" style="background:#0066CC; border-radius:24px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:500; color:#FFFFFF; text-decoration:none; letter-spacing:-0.005em;">
                        Sign in to PersonaOn
                      </a>
                    </td>
                  </tr>
                </table>

              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td class="footer" style="padding:24px 8px 0; font-size:12px; color:rgba(29,29,31,0.45); line-height:1.5;">
                <p style="margin:0 0 8px;">
                  If you didn't try to sign in, you can safely ignore this email.
                </p>
                <p style="margin:0;">
                  &copy; 2026 PersonaOn &middot; Your digital persona, always on.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
