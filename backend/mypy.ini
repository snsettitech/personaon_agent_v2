[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = True
no_implicit_optional = True
strict_optional = True

# Gradually enforce stricter checking — start permissive, tighten per module
disallow_untyped_defs = False
check_untyped_defs = True

# Per-module overrides — tighten these as code is cleaned up
[mypy-routers.*]
disallow_untyped_defs = False

[mypy-modules.*]
disallow_untyped_defs = False

[mypy-adk_core.*]
disallow_untyped_defs = False

# Third-party stubs — ignore missing
[mypy-firecrawl.*]
ignore_missing_imports = True

[mypy-google.adk.*]
ignore_missing_imports = True

[mypy-google.genai.*]
ignore_missing_imports = True

[mypy-pinecone.*]
ignore_missing_imports = True

[mypy-posthog.*]
ignore_missing_imports = True
