[pytest]
# Unit-test gate config (PON pilot B1). Every test must finish in 60s; a test
# that blocks on a dummy network host or a retry/sleep loop fails loudly
# instead of hanging the whole run.
testpaths = tests
timeout = 60
# Dump every thread's stack if a test is still running after 120s (works
# even where the per-test timeout cannot interrupt, e.g. a GIL-holding call).
faulthandler_timeout = 120
