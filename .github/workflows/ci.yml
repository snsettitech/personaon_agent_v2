# CI — the single required check (`ci`) for PRs into staging and main and for
# Mergify merge-queue batches (pilot step B2). Replaces lint.yml.
#
# Shape: `changes` classifies the diff, the heavy jobs run only for the areas
# that changed, and the final `ci` job always reports. It is green only when
# every needed job succeeded or was skipped because its area did not change.
#
# Path scoping never skips on doubt: a file outside the known areas, a missing
# base SHA, a failed diff or an empty file list all mean "run everything".
# Only the docs allowlist below is treated as "nothing to test".

name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, "mergify/merge-queue/**"]
  merge_group:
  workflow_dispatch:

concurrency:
  # PRs share one group per PR (superseded runs cancel); every pushed SHA gets
  # its own group so each staging commit reports `ci`.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      migrations: ${{ steps.classify.outputs.migrations }}
      dispatcher: ${{ steps.classify.outputs.dispatcher }}
      metrics: ${{ steps.classify.outputs.metrics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          all() {
            echo "Running everything: $1"
            { echo "backend=true"; echo "frontend=true"; echo "migrations=true"; echo "dispatcher=true"; echo "metrics=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group)  base="$MQ_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            all "event $EVENT" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            all "no base SHA"
          fi
          if ! files=$(git diff --no-renames --name-only "$base...HEAD" 2>/dev/null); then
            if ! files=$(git diff --no-renames --name-only "$base" HEAD 2>/dev/null); then
              all "git diff against $base failed"
            fi
          fi
          [ -n "$files" ] || all "empty file list"

          backend=false frontend=false migrations=false dispatcher=false metrics=false
          while IFS= read -r f; do
            # Code areas first, so markdown under backend/ or frontend/ counts as code.
            case "$f" in
              backend/*) backend=true ;;
              frontend/*) frontend=true ;;
              # Backend contract tests read supabase/migrations/, so run pytest too.
              supabase/migrations/*|scripts/check_migration_filenames.py|scripts/lint_migrations.py)
                migrations=true; backend=true ;;
              docs/*|plans/*|*.md|*.mdx|LICENSE|.github/ISSUE_TEMPLATE/*)
                ;;
              *) all "unclassified path $f" ;;
            esac
          done <<< "$files"

          echo "$files" | sed 's/^/  /'
          echo "backend=$backend frontend=$frontend migrations=$migrations dispatcher=$dispatcher metrics=$metrics"
          {
            echo "backend=$backend"; echo "frontend=$frontend"
            echo "migrations=$migrations"; echo "dispatcher=$dispatcher"; echo "metrics=$metrics"
          } >> "$GITHUB_OUTPUT"

  repo-guards:
    name: Repo guards (no LangChain)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No LangChain/LangGraph imports in backend
        run: |
          pattern="from langchain|import langchain|from langgraph|import langgraph"
          if grep -rn --include="*.py" -E "$pattern" backend/; then
            echo "FAIL: LangChain/LangGraph imports found in backend/"
            exit 1
          fi
          echo "PASS: no LangChain/LangGraph imports"

      - name: No legacy LangChain packages in requirements.txt
        run: |
          pattern="^langchain|^langgraph|^langchain-openai|^langchain-community|^composio-langchain|^graphiti-core"
          if grep -n -E "$pattern" backend/requirements.txt; then
            echo "FAIL: legacy LangChain packages found in backend/requirements.txt"
            exit 1
          fi
          echo "PASS: requirements.txt is clean"

  migration-hygiene:
    name: Migration lint
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint migrations
        run: |
          python scripts/check_migration_filenames.py
          python scripts/lint_migrations.py

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Unreachable placeholders: conftest.py already defaults these, they are
    # repeated here so a real secret can never leak in from the runner env.
    # The network guard (tests/_network_guard.py) fails any test that tries to
    # reach a non-loopback host.
    env:
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_SERVICE_KEY: dummy
      SUPABASE_KEY: dummy
      DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:9/dummy
      GOOGLE_API_KEY: dummy
      GEMINI_API_KEY: dummy
      OPENAI_API_KEY: dummy
      FIRECRAWL_API_KEY: dummy
      ELEVENLABS_API_KEY: dummy
      RECALL_API_KEY: dummy
      RESEND_API_KEY: dummy
      JWT_SECRET: test-jwt-secret-not-real-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Includes the vector pipeline contract tests that lint.yml ran on their
      # own (test_vector_pipeline_contract.py, test_vector_store.py,
      # test_publish_tab_persistence.py).
      - name: pytest
        working-directory: backend
        run: python -m pytest tests -q -n auto --dist loadfile

  frontend-checks:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Onboarding/signup analytics guard
        run: npm run enforce:analytics

      - name: Unit tests
        run: bun test

  ci:
    name: ci
    needs: [changes, repo-guards, migration-hygiene, backend-tests, frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass or be skipped by path scoping
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: >-
            repo-guards=${{ needs.repo-guards.result }}
            migration-hygiene=${{ needs.migration-hygiene.result }}
            backend-tests=${{ needs.backend-tests.result }}
            frontend-checks=${{ needs.frontend-checks.result }}
        run: |
          echo "changes=$CHANGES"
          # A skip is only by design when `changes` succeeded and decided it.
          if [ "$CHANGES" != "success" ]; then
            echo "FAIL: change detection did not succeed"
            exit 1
          fi
          fail=0
          for r in $RESULTS; do
            echo "$r"
            case "${r#*=}" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          [ "$fail" = 0 ] || { echo "FAIL: a required job did not pass"; exit 1; }
          echo "PASS"
